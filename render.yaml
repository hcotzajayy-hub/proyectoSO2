services:
  - type: web
    name: api-devops-intecap
    runtime: docker
    repo: https://github.com/javierdevops/api-intecap-so2
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString

databases:
  - name: postgres-db
    plan: free
